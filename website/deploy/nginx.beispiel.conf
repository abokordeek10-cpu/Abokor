# ─────────────────────────────────────────────────────────────
#  VORSCHLAG für Nginx – nur nutzen, falls n8n bereits über Nginx läuft.
#  Als neue Datei anlegen: /etc/nginx/sites-available/abora-automation.de
#  Den bestehenden n8n-Block NICHT verändern.
#  HTTPS-Zertifikat danach mit:
#    certbot --nginx -d abora-automation.de -d www.abora-automation.de
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name abora-automation.de www.abora-automation.de;

    root /var/www/abora-automation.de;
    index index.html;

    # www → ohne www (greift nach certbot auch für HTTPS)
    if ($host = www.abora-automation.de) {
        return 301 https://abora-automation.de$request_uri;
    }

    # /leistungen → leistungen.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* ^/(_astro|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 512;

    server_tokens off;
}
