<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(inter.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0}body{font-family:Inter;background:#000}
.flaeche{position:relative;overflow:hidden;background-color:#0a1424;
 background-image:radial-gradient(ellipse 60% 60% at 82% 30%,rgba(255,200,61,.12),transparent 70%),radial-gradient(ellipse 60% 70% at 5% 0%,rgba(60,110,190,.25),transparent 70%),
 linear-gradient(rgba(120,160,225,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,225,.07) 1px,transparent 1px),
 linear-gradient(rgba(120,160,225,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,225,.14) 1px,transparent 1px);
 background-size:auto,auto,28px 28px,28px 28px,140px 140px,140px 140px;color:#f6f4ef}
#logo{width:720px;height:720px;display:grid;place-items:center}
#logo img{width:520px}

#titel{width:1024px;height:576px;padding:72px 80px;display:flex;flex-direction:column;justify-content:center}
.dach{font:600 15px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:#ffc83d;text-transform:uppercase;margin-bottom:22px}
h1{font-size:62px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.marke{background:#ffc83d;color:#111;padding:0 .14em .04em;border-radius:6px;display:inline-block;transform:rotate(-1.2deg)}
.unter{font-size:24px;font-weight:700;margin-top:24px;color:#dfe5ee}
.zeichen{position:absolute;right:70px;top:64px;width:120px;opacity:.95}
.fuss{position:absolute;left:80px;bottom:50px;display:flex;gap:26px;font-size:16px;font-weight:600;color:#a9b8cc}
.fuss span::before{content:'✓ ';color:#ffc83d}
</style></head><body>
<div id="logo" class="flaeche"><img src="logo-hell.png" alt=""></div>
<div id="titel" class="flaeche">
 <img class="zeichen" src="zeichen-hell.png" alt="">
 <p class="dach">Abora Automation · Viernheim</p>
 <h1>Du machst das <span class="marke">Handwerk.</span><br>Wir machen den Rest.</h1>
 <p class="unter">KI-Automatisierung für Handwerksbetriebe: weniger Büro, mehr Zeit für Aufträge.</p>
 <div class="fuss"><span>Anrufe &amp; Anfragen</span><span>Termine</span><span>Angebote</span><span>Kostenloser Büro-Check</span></div>
</div></body></html>
