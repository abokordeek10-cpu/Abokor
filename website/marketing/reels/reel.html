<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Abora Reel</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('fonts/inter-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('fonts/inter-latin-ext-wght-normal.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20C0, U+2C60-2C7F, U+A720-A7FF; }
  :root { --dunkel:#14202e; --tief:#0d1620; --blau:#3d5875; --gelb:#ffc83d; --hell:#f6f4ef; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--dunkel); }
  body { font-family: 'Inter', sans-serif; color: var(--hell); -webkit-font-smoothing: antialiased; }
  .buehne { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(ellipse 70% 40% at 80% 8%, rgba(255,170,70,.16), transparent 70%),
                radial-gradient(ellipse 60% 40% at 0% 100%, rgba(61,88,117,.55), transparent 70%),
                linear-gradient(170deg, #1b2a3b, var(--dunkel) 45%, var(--tief)); }
  .szene { position: absolute; inset: 0; opacity: 0; transition: opacity .45s ease; }
  .szene.an { opacity: 1; }

  /* Marke & Demo-Kennzeichnung */
  .marke { position: absolute; top: 120px; left: 70px; display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 40px; letter-spacing: -.03em; z-index: 5; }
  .marke i { font-style: normal; width: 64px; height: 64px; border-radius: 16px; background: var(--gelb); color: var(--dunkel); display: grid; place-items: center; font-size: 40px; font-weight: 900; }
  .marke span { font-weight: 500; opacity: .75; }
  .demo-tag { position: absolute; top: 132px; right: 160px; z-index: 5; font-size: 26px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    color: var(--gelb); border: 2px solid rgba(255,200,61,.5); background: rgba(255,200,61,.12); padding: 10px 20px; border-radius: 999px; }

  /* Hook */
  .hook { display: flex; flex-direction: column; justify-content: center; padding: 0 80px 200px; }
  .hook h1 { font-size: 112px; line-height: 1.02; font-weight: 850; letter-spacing: -.045em; }
  .hook h1 span { display: block; opacity: 0; transform: translateY(40px); transition: all .5s cubic-bezier(.2,.8,.2,1); }
  .hook h1 span.an { opacity: 1; transform: none; }
  .hook h1 span:nth-child(2) { color: var(--gelb); }
  .hook .strich { width: 120px; height: 10px; background: var(--gelb); border-radius: 5px; margin-bottom: 48px; }

  /* Zeile oben */
  .zeile { position: absolute; top: 230px; left: 70px; right: 160px; font-size: 60px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; z-index: 4; min-height: 140px; }
  .zeile span { display: inline; background: linear-gradient(transparent 60%, rgba(255,200,61,.45) 60%); }
  .zeile.wechsel { opacity: 0; transform: translateY(16px); }
  .zeile { transition: opacity .3s, transform .3s; }

  /* Handy */
  .handy { position: absolute; left: 90px; right: 170px; top: 420px; height: 1080px; border-radius: 56px; background: #0b141a; border: 14px solid #05090c;
    box-shadow: 0 50px 120px -30px rgba(0,0,0,.8), 0 0 0 2px rgba(255,255,255,.08); overflow: hidden; display: flex; flex-direction: column; }
  .h-kopf { display: flex; align-items: center; gap: 22px; padding: 26px 30px; background: #1f2c34; }
  .h-kopf b { display: block; font-size: 32px; color: #e9edef; }
  .h-kopf small { font-size: 24px; color: #8696a0; }
  .h-kopf .av { width: 70px; height: 70px; border-radius: 50%; background: var(--blau); display: grid; place-items: center; font-weight: 800; font-size: 34px; color: #e9edef; flex: none; }
  .verlauf { flex: 1; padding: 30px 24px; display: flex; flex-direction: column; gap: 18px; justify-content: flex-end; overflow: hidden; }
  .blase { max-width: 86%; padding: 18px 22px 12px; border-radius: 22px; font-size: 36px; line-height: 1.36; color: #e9edef; animation: rein .4s cubic-bezier(.2,.8,.2,1); }
  .blase.k { align-self: flex-end; background: #005c4b; border-top-right-radius: 6px; }
  .blase.b { align-self: flex-start; background: #202c33; border-top-left-radius: 6px; }
  .blase .z { display: block; text-align: right; font-size: 22px; color: rgba(233,237,239,.55); margin-top: 6px; }
  .blase .ki { display: inline-block; font-size: 20px; font-weight: 800; letter-spacing: .06em; color: var(--gelb); margin-bottom: 6px; }
  .tippt { align-self: flex-start; display: flex; gap: 10px; padding: 26px 28px; background: #202c33; border-radius: 22px; }
  .tippt i { width: 16px; height: 16px; border-radius: 50%; background: rgba(233,237,239,.75); animation: tippen 1s infinite; }
  .tippt i:nth-child(2) { animation-delay: .15s } .tippt i:nth-child(3) { animation-delay: .3s }
  .eingabe { display: flex; align-items: center; gap: 18px; padding: 20px; background: #1f2c34; }
  .eingabe div { flex: 1; min-height: 80px; border-radius: 40px; background: #2a3942; color: #e9edef; font-size: 32px; padding: 20px 30px; line-height: 1.3; }
  .eingabe div:empty::before { content: 'Nachricht'; color: #8696a0; }
  .eingabe b { width: 80px; height: 80px; border-radius: 50%; background: #00a884; flex: none; display: grid; place-items: center; }
  .eingabe b::after { content: ''; border-left: 30px solid #fff; border-top: 18px solid transparent; border-bottom: 18px solid transparent; margin-left: 8px; }
  @keyframes rein { from { opacity: 0; transform: translateY(24px) scale(.97); } }
  @keyframes tippen { 0%,60%,100% { transform: translateY(0); opacity: .5 } 30% { transform: translateY(-8px); opacity: 1 } }

  /* Benachrichtigung */
  .bn { position: absolute; left: 60px; right: 150px; top: 470px; z-index: 6; display: flex; gap: 26px; padding: 28px 32px; border-radius: 40px;
    background: rgba(255,255,255,.98); color: #111; box-shadow: 0 40px 90px -20px rgba(0,0,0,.75);
    transform: translateY(-140%); opacity: 0; transition: all .55s cubic-bezier(.2,.9,.25,1.15); }
  .bn.an { transform: none; opacity: 1; }
  .bn.notfall { outline: 8px solid #e5484d; }
  .bn i { font-style: normal; width: 88px; height: 88px; flex: none; border-radius: 22px; background: var(--gelb); color: var(--dunkel); display: grid; place-items: center; font-weight: 900; font-size: 50px; }
  .bn div { flex: 1; display: grid; gap: 4px; }
  .bn small { display: flex; justify-content: space-between; font-size: 24px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #6b6f76; }
  .bn b { font-size: 38px; letter-spacing: -.01em; }
  .bn span { font-size: 32px; color: #3f444b; line-height: 1.25; }

  /* Sprachnotiz & Angebot */
  .sprach { position: absolute; left: 70px; right: 160px; top: 440px; padding: 34px; border-radius: 36px; background: #005c4b; animation: rein .5s; }
  .welle { display: flex; align-items: center; gap: 8px; height: 90px; }
  .welle .play { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,.18); flex: none; display: grid; place-items: center; margin-right: 14px; }
  .welle .play::after { content: ''; border-left: 26px solid #fff; border-top: 16px solid transparent; border-bottom: 16px solid transparent; margin-left: 6px; }
  .welle s { flex: 1; background: rgba(233,237,239,.85); border-radius: 4px; animation: welle 1.1s infinite ease-in-out; }
  @keyframes welle { 0%,100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }
  .sprach p { font-size: 34px; line-height: 1.4; margin-top: 22px; color: #e9edef; }
  .sprach p em { font-style: normal; opacity: .6; }
  .doc { position: absolute; left: 70px; right: 160px; top: 440px; bottom: 300px; background: #fff; color: #111; border-radius: 18px; padding: 44px 40px;
    box-shadow: 0 50px 120px -30px rgba(0,0,0,.85); opacity: 0; transform: translateY(60px); transition: all .6s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
  .doc.an { opacity: 1; transform: none; }
  .doc .dk { display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--dunkel); padding-bottom: 20px; margin-bottom: 24px; font-size: 26px; font-weight: 800; }
  .doc .dk em { font-style: normal; font-size: 20px; letter-spacing: .08em; color: var(--blau); border: 2px solid rgba(61,88,117,.35); border-radius: 999px; padding: 6px 14px; }
  .doc h2 { font-size: 46px; letter-spacing: -.03em; margin-bottom: 26px; }
  .pos { display: grid; grid-template-columns: 1fr auto; gap: 24px; padding: 18px 0; border-bottom: 2px solid #eee; font-size: 28px; line-height: 1.3; animation: rein .35s; }
  .pos div { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pos b { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .summe { display: flex; justify-content: space-between; font-size: 40px; font-weight: 850; border-top: 5px solid var(--dunkel); margin-top: 22px; padding-top: 22px; animation: rein .4s; }
  .doc .fuss { font-size: 22px; color: #666; margin-top: 16px; }

  /* Abschluss */
  .ende { display: flex; flex-direction: column; justify-content: center; padding: 0 80px 260px; }
  .ende h2 { font-size: 104px; line-height: 1.02; letter-spacing: -.045em; font-weight: 850; }
  .ende h2 span { color: var(--gelb); display: block; }
  .ende p { font-size: 44px; margin-top: 50px; color: #d4dae1; line-height: 1.3; }
  .ende .knopf { margin-top: 60px; align-self: flex-start; background: var(--gelb); color: #111; font-weight: 850; font-size: 46px; padding: 34px 50px; border-radius: 26px; box-shadow: 0 24px 60px -20px rgba(255,200,61,.7); }
  .ende .url { margin-top: 36px; font-size: 40px; font-weight: 700; }
  .hinweis { position: absolute; left: 70px; bottom: 120px; right: 160px; font-size: 24px; color: rgba(246,244,239,.55); z-index: 5; }
</style>
</head>
<body>
<div class="buehne" id="b">
  <div class="marke"><i>A</i>Abora<span>&nbsp;Automation</span></div>
  <div class="demo-tag">Echte KI · Demo</div>

  <section class="szene hook" id="s-hook"><div class="strich"></div><h1 id="hook"></h1></section>

  <section class="szene" id="s-haupt">
    <div class="zeile" id="zeile"></div>
    <div class="bn" id="bn"><i>A</i><div><small><span>Abora</span><span>jetzt</span></small><b></b><span></span></div></div>
    <div id="inhalt"></div>
  </section>

  <section class="szene ende" id="s-ende">
    <h2>Du machst das Handwerk. <span>Wir machen den Rest.</span></h2>
    <p>KI für Handwerksbetriebe:<br>Anfragen, Termine, Angebote.<br>Läuft automatisch.</p>
    <div class="knopf">Kostenloses Erstgespräch</div>
    <div class="url">abora-automation.de · Link in Bio</div>
  </section>
  <div class="hinweis" id="hinweis">Demo mit erfundenem Musterbetrieb. KI-Antworten echt und ungekürzt.</div>
</div>
<script>
const warte = (ms) => new Promise(r => setTimeout(r, ms));
const $ = (s) => document.querySelector(s);
const zeigen = (id) => { document.querySelectorAll('.szene').forEach(s => s.classList.toggle('an', s.id === id)); };
const zeit = () => new Date(2026, 10, 9, 10, 42).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

async function zeile(text) {
  const z = $('#zeile'); z.classList.add('wechsel'); await warte(300);
  z.innerHTML = '<span></span>'; z.firstChild.textContent = text; z.classList.remove('wechsel');
}
async function hook(teile) {
  zeigen('s-hook'); const h = $('#hook');
  for (const t of teile) { const s = document.createElement('span'); s.textContent = t; h.append(s); await warte(60); s.classList.add('an'); await warte(900); }
  await warte(900);
}
function meldung(m) {
  const bn = $('#bn'); bn.classList.toggle('notfall', !!m.notfall);
  bn.querySelector('b').textContent = m.titel; bn.querySelector('div > span').textContent = m.text; bn.classList.add('an');
}
function handy(betrieb) {
  $('#inhalt').innerHTML = `<div class="handy"><div class="h-kopf"><div class="av">M</div><div><b></b><small>antwortet sofort</small></div></div>
    <div class="verlauf"></div><div class="eingabe"><div></div><b></b></div></div>`;
  $('.h-kopf b').textContent = betrieb;
}
function blase(rolle, text) {
  const v = $('.verlauf'); const d = document.createElement('div'); d.className = 'blase ' + rolle;
  if (rolle === 'b') { const k = document.createElement('span'); k.className = 'ki'; k.textContent = 'KI-ANTWORT'; d.append(k, document.createElement('br')); }
  d.append(document.createTextNode(text)); const z = document.createElement('span'); z.className = 'z'; z.textContent = zeit() + (rolle === 'b' ? ' ✓✓' : ''); d.append(z);
  v.append(d);
  while (v.scrollHeight > v.clientHeight && v.children.length > 1) v.firstElementChild.remove();
}
async function tippen(text) {
  const e = $('.eingabe div'); e.textContent = '';
  for (const c of text) { e.textContent += c; await warte(24); }
  await warte(250); e.textContent = ''; blase('k', text);
}
async function kiAntwort(text, dauer = 1300) {
  const v = $('.verlauf'); const t = document.createElement('div'); t.className = 'tippt'; t.innerHTML = '<i></i><i></i><i></i>'; v.append(t);
  $('.h-kopf small').textContent = 'schreibt …'; await warte(dauer); t.remove(); $('.h-kopf small').textContent = 'antwortet sofort'; blase('b', text);
}
const lesezeit = (t) => Math.min(5200, 1400 + t.length * 32);

const euro = (n) => n.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });

async function chatReel(r) {
  await hook(r.hook);
  handy(r.betrieb); zeigen('s-haupt');
  await zeile(r.zeilen[0]); await warte(500);
  await tippen(r.kunde); await warte(300);
  await kiAntwort(r.ki); await warte(lesezeit(r.ki) * 0.5);
  await zeile(r.zeilen[1]);
  if (r.kunde2) {
    await warte(lesezeit(r.ki) * 0.5);
    await tippen(r.kunde2); await kiAntwort(r.ki2, 1100); await warte(900);
  } else { await warte(lesezeit(r.ki) * 0.6); }
  await zeile(r.zeilen[2]); await warte(400);
  meldung(r.meldung); await warte(3400);
}

async function angebotReel(r) {
  await hook(r.hook);
  $('#inhalt').innerHTML = `<div class="sprach"><div class="welle"></div><p></p></div>`;
  const w = $('.welle'); w.innerHTML = '<div class="play"></div>';
  for (let i = 0; i < 34; i++) { const s = document.createElement('s'); s.style.height = (30 + Math.abs(Math.sin(i * 1.7)) * 70) + '%'; s.style.animationDelay = (i * 0.05) + 's'; w.append(s); }
  zeigen('s-haupt'); await zeile(r.zeilen[0]);
  const p = $('.sprach p'); const woerter = r.notiz.split(' ');
  for (const wort of woerter) { p.textContent += (p.textContent ? ' ' : '') + wort; await warte(95); }
  await warte(1200);
  await zeile(r.zeilen[1]);
  $('#inhalt').insertAdjacentHTML('beforeend', `<div class="doc"><div class="dk"><span></span><em>BEISPIELPREISE</em></div><h2></h2><div class="posliste"></div></div>`);
  $('.doc .dk span').textContent = r.betrieb; $('.doc h2').textContent = r.titel;
  await warte(100); $('.sprach').style.opacity = '0'; $('.doc').classList.add('an'); await warte(700);
  let netto = 0;
  for (const x of r.positionen) {
    const s = Math.round(x.menge * x.einzelpreis_netto * 100) / 100; netto += s;
    const d = document.createElement('div'); d.className = 'pos';
    const a = document.createElement('div'); a.textContent = `${String(x.menge).replace('.', ',')} ${x.einheit} · ${x.bezeichnung}`;
    const b = document.createElement('b'); b.textContent = euro(s); d.append(a, b); $('.posliste').append(d); await warte(520);
  }
  const brutto = Math.round(netto * 1.19 * 100) / 100;
  $('.posliste').insertAdjacentHTML('beforeend', `<div class="summe"><span>Gesamt inkl. MwSt.</span><span>${euro(brutto)}</span></div><p class="fuss">Entwurf der KI. Preise im echten Einsatz aus deiner Preisliste.</p>`);
  await warte(1400); await zeile(r.zeilen[2]); await warte(300);
  meldung(r.meldung); await warte(3200);
}

async function los() {
  const name = new URLSearchParams(location.search).get('reel');
  const r = (await (await fetch('reels.json')).json())[name];
  await document.fonts.ready; await warte(400);
  if (name === 'angebot') await angebotReel(r); else await chatReel(r);
  $('#bn').classList.remove('an'); zeigen('s-ende'); await warte(4200);
  window.__fertig = true;
}
window.__start = los;
</script>
</body>
</html>
